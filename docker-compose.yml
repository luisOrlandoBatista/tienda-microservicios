services:
  catalogo-db:
    image: postgres:18
    container_name: tienda-catalogo-db
    environment:
      POSTGRES_DB: catalogo
      POSTGRES_USER: catalogo
      POSTGRES_PASSWORD: catalogo
    ports:
      - "5433:5432"            # puerto de tu Mac : puerto dentro del contenedor
    volumes:
      - catalogo-db-data:/var/lib/postgresql   # los datos sobreviven aunque pares el contenedor

  pedidos-db:                              # NUEVO
    image: postgres:18
    container_name: tienda-pedidos-db
    environment:
      POSTGRES_DB: pedidos
      POSTGRES_USER: pedidos
      POSTGRES_PASSWORD: pedidos
    ports:
      - "5434:5432"
    volumes:
      - pedidos-db-data:/var/lib/postgresql

  auth-db:
    image: postgres:18
    container_name: tienda-auth-db
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
    ports:
      - "5435:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql

volumes:
  catalogo-db-data:
  pedidos-db-data:
  auth-db-data: