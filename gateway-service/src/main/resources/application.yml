server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth
              uri: http://localhost:8083
              predicates:
                - Path=/auth/**, /.well-known/**

            - id: catalogo
              uri: http://localhost:8081
              predicates:
                - Path=/api/productos/**

            - id: pedidos
              uri: http://localhost:8082
              predicates:
                - Path=/api/pedidos/**

          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: "http://localhost:4200"
                allowed-methods: GET, POST, PUT, DELETE, OPTIONS
                allowed-headers: "*"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true