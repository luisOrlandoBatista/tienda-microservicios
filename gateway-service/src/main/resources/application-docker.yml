spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth
              uri: http://auth-service:8083
              predicates:
                - Path=/auth/**, /.well-known/**

            - id: catalogo
              uri: http://catalogo-service:8081
              predicates:
                - Path=/api/productos/**

            - id: pedidos
              uri: http://pedidos-service:8082
              predicates:
                - Path=/api/pedidos/**